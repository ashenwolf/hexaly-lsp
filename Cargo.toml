[package]
name = "hexaly-lsp"
description = "Language server for Hexaly Modeler models (.hxm)"
version = "0.1.0"
authors = ["Sergii Gulenok"]
license = "MIT"
repository = "https://github.com/ashenwolf/hexaly-lsp"
edition = "2024"

[dependencies]
# The maintained community fork. The original `tower-lsp` has been unreleased since early 2023
# and still runs notification handlers concurrently, which reorders didChange against didClose.
tower-lsp-server = "0.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std", "fs", "process"] }
tree-sitter = "0.25.10"
tree-sitter-hexaly = { git = "https://github.com/ashenwolf/tree-sitter-hexaly", rev = "4dd3917847d9a15cc3bd50bf32e267a99e12288e" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# An editor launches this on every workspace open, so size and startup matter more than the
# last few percent of throughput.
strip = true
